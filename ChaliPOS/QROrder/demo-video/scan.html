<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>camera</title>
<!-- 演示视频专用：模拟手机相机扫桌上的二维码（poster-shot.png 由 record.mjs 先截好） -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, "Hiragino Sans", "PingFang SC", sans-serif; }
  .scene {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, #8a6a4c 0%, #5b4330 45%, #2a1f17 100%);
    filter: saturate(0.9);
  }
  .poster {
    position: absolute; left: 50%; top: 47%; width: 300px;
    transform: translate(-50%, -50%) perspective(900px) rotateX(10deg) rotate(-2deg);
    box-shadow: 0 30px 50px rgba(0, 0, 0, 0.45); border-radius: 4px;
    animation: drift 2.4s ease-in-out infinite alternate;
  }
  @keyframes drift { from { margin-left: -4px; } to { margin-left: 4px; } }
  .hint { position: absolute; top: 64px; left: 0; right: 0; text-align: center; color: #fff; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
  .frame { position: absolute; left: 50%; top: 45.5%; width: 190px; height: 190px; transform: translate(-50%, -50%); }
  .frame i { position: absolute; width: 34px; height: 34px; border: 5px solid #FFD43B; }
  .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .line { position: absolute; left: 8px; right: 8px; height: 3px; background: rgba(255, 212, 59, 0.9); box-shadow: 0 0 12px #FFD43B; animation: scan 1.1s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 10px; } to { top: 176px; } }
  .found .line { display: none; }
  .found .frame { animation: pop 0.35s ease-out; }
  @keyframes pop { 50% { transform: translate(-50%, -50%) scale(0.92); } }
  .open {
    position: absolute; left: 50%; bottom: 120px; transform: translate(-50%, 30px); opacity: 0;
    background: #FFD43B; color: #1b1b1b; border: 0; border-radius: 999px; padding: 13px 22px;
    font-size: 16px; font-weight: 800; white-space: nowrap; transition: all 0.3s ease-out;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }
  .found .open { opacity: 1; transform: translate(-50%, 0); }
  .shutter { position: absolute; left: 50%; bottom: 28px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; border: 4px solid #fff; box-sizing: border-box; }
  .shutter::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
  .lock { position: absolute; inset: 0; z-index: 5; background: linear-gradient(160deg, #2b3a33, #101614); color: #fff; text-align: center; padding-top: 120px; transition: opacity 0.4s; }
  .lock .d { font-size: 20px; opacity: 0.8; }
  .lock .t { font-size: 84px; font-weight: 300; }
  .lock.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="lock" id="lock"><div class="d" id="d"></div><div class="t">14:30</div></div>
<div class="scene" id="scene">
  <img class="poster" src="poster-shot.png" alt="">
  <div class="hint">QRコードを読み取っています…</div>
  <div class="frame"><i></i><i></i><i></i><i></i><div class="line"></div></div>
  <button class="open" id="open">🧭 wzz122.github.io で開く</button>
  <div class="shutter"></div>
</div>
<script>
  // 先显示锁屏；录像脚本调用 startScan() 切到相机
  document.getElementById("d").textContent = new Date().toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "long" });
  window.startScan = () => {
    document.getElementById("lock").classList.add("off");
    setTimeout(() => {
      document.getElementById("scene").classList.add("found");
      document.querySelector(".hint").textContent = "QRコード：茶里茶里 モバイルオーダー";
    }, 1700);
  };
  document.getElementById("open").addEventListener("click", () => { location.href = "./?t=3"; });
</script>
</body>
</html>
