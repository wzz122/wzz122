<style>

function guessLang() {
  const l = (navigator.language || "").toLowerCase();
  return l.startsWith("zh") ? "zh" : l.startsWith("ja") ? "ja" : "en";
}

const t = (key) => T[lang][key];
const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");
// 顾客语言的名字；副标题用日文（中文、英文顾客跟店员说日文名也能对上），日文顾客副标题用中文
const nameOf = (x) => (lang === "ja" ? x.nameJP || x.name : lang === "en" ? x.nameEN || x.nameJP || x.name : x.name || x.nameJP);
const altOf = (x) => (lang === "ja" ? x.name : x.nameJP);
// 标配小料，例如「タピオカ入り」「含珍珠」「with Tapioca pearls」
function includedText(item) {
  const names = (item.includedToppingIDs || []).map((id) => toppingById(id)).filter(Boolean).map(nameOf);
  if (!names.length) return null;
  const list = names.join(lang === "en" ? ", " : "・");
  return lang === "ja" ? list + t("included") : t("included") + (lang === "en" ? " " : "") + list;
}

// 安全地创建元素（菜单名称都用 textContent，不拼 HTML）
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

// 替换元素内容：和 h() 一样展开数组、跳过空值（replaceChildren 本身不会）
function fill(el, ...children) {
  el.replaceChildren(...children.flat(Infinity)
    .filter((c) => c !== null && c !== undefined && c !== false)
    .map((c) => (c.nodeType ? c : document.createTextNode(String(c)))));
}

// ---------------------------------------------------------------------------
// 接口
// ---------------------------------------------------------------------------
async function rpc(fn, args) {
  const headers = { "Content-Type": "application/json", apikey: CONFIG.anonKey || "" };
  if ((CONFIG.anonKey || "").startsWith("eyJ")) headers.Authorization = "Bearer " + CONFIG.anonKey;
  let res;
  try {
    res = await fetch(REST + "/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(args) });
  } catch (e) {
    throw new Error("network");
  }
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.message) || "default");
  return body;
}

function errorText(code) {
  const e = T[lang].errors;
  if (code.startsWith("sold_out")) return e.sold_out;
  if (code === "store_not_found") return e.store;
  return e[code] || e.default;
}

// ---------------------------------------------------------------------------
function convert(price) {
  const on = state.dining === "eatIn" && state.menu && state.menu.eatInPricing === "convertByTaxRate";
  return on ? Math.floor((price * 110 * 2 + 108) / (108 * 2)) : price;
}
function basePrice(item, size) {
  const p = item.prices[size.toLowerCase()];
  return p === undefined || p === null ? null : convert(p);
}
function toppingById(id) { return state.menu.toppings.find((x) => x.id === id); }
function unitPrice(line) {
  const item = itemById(line.itemID);
  if (!item) return 0;
  return basePrice(item, line.size) + line.toppingIDs.reduce((s, id) => s + convert((toppingById(id) || { price: 0 }).price), 0);
}
function itemById(id) { return state.menu.items.find((x) => x.id === id); }
function isSoldOut(item) { return item.soldOut && state.menu.businessDay === state.today; }
function sizesOf(item) { return ["M", "L"].filter((s) => item.prices[s.toLowerCase()] != null); }
function cartTotal() { return state.cart.reduce((s, l) => s + unitPrice(l) * l.quantity, 0); }
function cartCount() { return state.cart.reduce((s, l) => s + l.quantity, 0); }
function optionText(line) {
  const parts = [line.size, (TEMP[lang] || TEMP.ja)[line.temp], line.sweetness + "%"];
  for (const id of line.toppingIDs) {
    const tp = toppingById(id);
    if (tp) parts.push("+" + nameOf(tp));
  }
  return parts.join("・");
}

// ---------------------------------------------------------------------------
// 页面
// ---------------------------------------------------------------------------
function render() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  const app = document.getElementById("app");
  app.replaceChildren();
  app.append(renderHeader());
  if (state.loading) {
    app.append(h("div", { class: "loading" }, "…"));
  } else if (state.order) {
    app.append(renderStatus());
  } else {
    app.append(renderMenu());
  }
  renderCartBar();
}

function renderHeader() {
  return h("header", {},
    h("div", { class: "brand" },
      h("h1", {}, state.storeName),
      h("span", { class: "tag" }, "ORDER"),
      h("span", { class: "spacer" }),
      h("div", { class: "lang" },
        h("button", { class: lang === "ja" ? "on" : "", onclick: () => setLang("ja") }, "日本語"),
        h("button", { class: lang === "zh" ? "on" : "", onclick: () => setLang("zh") }, "中文"),
        h("button", { class: lang === "en" ? "on" : "", onclick: () => setLang("en") }, "EN"),
      ),
    ),
    h("div", { class: "sub" }, t("sub"), SEAT ? h("span", { class: "seat" }, t("seat") + " " + SEAT) : null),
  );
}

function renderMenu() {
  const frag = document.createDocumentFragment();
  if (state.error && !state.menu) {
    frag.append(h("div", { class: "notice warn" }, state.error));
    return frag;
  }
  if (!state.accepting) frag.append(h("div", { class: "notice warn" }, t("closed")));

  frag.append(h("div", { class: "dining" },
    h("button", { class: state.dining === "takeOut" ? "on" : "", onclick: () => setDining("takeOut") }, t("takeOut"), h("small", {}, t("takeOutTax"))),
    h("button", { class: state.dining === "eatIn" ? "on" : "", onclick: () => setDining("eatIn") }, t("eatIn"), h("small", {}, t("eatInTax"))),
  ));
  frag.append(h("button", { class: "faqbtn", onclick: openFaq }, "？ " + t("faqBtn")));

  const cats = state.menu.categories.filter((c) => state.menu.items.some((i) => i.categoryID === c.id));
  frag.append(h("nav", { class: "cats" }, cats.map((c) =>
    h("button", {
      class: state.activeCat === c.id ? "on" : "",
      style: state.activeCat === c.id ? "background:#" + c.colorHex : null,
      onclick: () => jumpTo(c.id),
    }, nameOf(c)),
  )));

  for (const c of cats) {
    const items = state.menu.items.filter((i) => i.categoryID === c.id);
    frag.append(h("section", { class: "cat", id: "cat-" + c.id },
      h("h2", { style: "color:#" + c.colorHex }, nameOf(c)),
      items.map((item) => renderItem(item, c)),
    ));
  }
  return frag;
}

function renderItem(item, cat) {
  const soldOut = isSoldOut(item);
  const prices = sizesOf(item).map((s) => s + " " + yen(basePrice(item, s))).join(" / ");
  return h("button", {
    class: "item" + (soldOut ? " soldout" : ""),
    style: "--c:#" + cat.colorHex,
    disabled: soldOut || !state.accepting,
    onclick: () => openItem(item),
  },
    h("div", { class: "names" },
      h("div", { class: "name" }, nameOf(item)),
      h("div", { class: "alt" }, altOf(item)),
      h("div", { class: "price" }, prices,
        includedText(item) ? h("span", { class: "inc" }, includedText(item)) : null,
        item.allowedTemps.includes("hot") ? h("span", { class: "hot" }, t("hot")) : null),
    ),
    soldOut ? h("span", { class: "stamp" }, t("soldOut")) : h("span", { class: "plus" }, "+"),
  );
}

function renderCartBar() {
  const bar = document.getElementById("cartbar");
  const count = cartCount();
  if (state.order || count === 0) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  fill(bar, h("button", { onclick: openCart },
    h("span", { class: "count" }, String(count)),
    h("span", { class: "grow" }, t("viewCart")),
    h("span", {}, yen(cartTotal())),
  ));
}

// 规格弹层
function openItem(item) {
  const draft = {
    itemID: item.id,
    size: item.defaultSize,
    temp: item.defaultTemp,
    sweetness: item.defaultSweetness,
    toppingIDs: [],
    quantity: 1,
  };
  if (!sizesOf(item).includes(draft.size)) draft.size = sizesOf(item)[0];

  const draw = () => {
    const sheet = document.getElementById("sheet");
    const toppings = state.menu.toppings.filter((tp) => item.allowedToppingIDs.includes(tp.id));
    const sizes = sizesOf(item);
    fill(sheet,
      h("div", { class: "head" },
        h("div", {}, h("h3", {}, nameOf(item)), h("div", { class: "alt" }, altOf(item),
          includedText(item) ? h("span", { class: "inc" }, includedText(item)) : null)),
        h("button", { class: "close", "aria-label": "close", onclick: closeSheet }, "✕"),
      ),
      sizes.length > 1 ? group(t("size"), sizes.map((s) =>
        chip(s, draft.size === s, () => { draft.size = s; draw(); }, yen(basePrice(item, s))))) : null,
      item.allowedTemps.length > 1 ? group(t("temp"), item.allowedTemps.map((tp) =>
        chip((TEMP[lang] || TEMP.ja)[tp], draft.temp === tp, () => { draft.temp = tp; draw(); }, null, tp === "hot"))) : null,
      item.allowedSweetness.length > 1 ? group(t("sweet"), item.allowedSweetness.map((sw) =>
        chip(sw + "%", draft.sweetness === sw, () => { draft.sweetness = sw; draw(); }))) : null,
      toppings.length ? group(t("toppings"), toppings.map((tp) =>
        chip(nameOf(tp), draft.toppingIDs.includes(tp.id), () => {
          draft.toppingIDs = draft.toppingIDs.includes(tp.id)
            ? draft.toppingIDs.filter((x) => x !== tp.id)
            : state.menu.toppings.map((x) => x.id).filter((id) => id === tp.id || draft.toppingIDs.includes(id));
          draw();
        }, "+" + yen(convert(tp.price))))) : null,
      group(t("qty"), [h("div", { class: "qty" },
        h("button", { onclick: () => { draft.quantity = Math.max(1, draft.quantity - 1); draw(); } }, "−"),
        h("span", {}, String(draft.quantity)),
        h("button", { onclick: () => { draft.quantity = Math.min(20, draft.quantity + 1); draw(); } }, "+"),
      )]),
      h("button", { class: "primary", onclick: () => { addToCart(draft); closeSheet(); } },
        t("add") + "  " + yen(unitPrice(draft) * draft.quantity)),
    );
  };
  draw();
  showSheet();
}

// 「第一次来？」：把店员常被问的基本问题先写清楚
function openFaq() {
  fill(document.getElementById("sheet"),
    h("div", { class: "head" },
      h("div", {}, h("h3", {}, t("faqBtn"))),
      h("button", { class: "close", "aria-label": "close", onclick: closeSheet }, "✕"),
    ),
    h("ol", { class: "faq" }, t("faq").map((x) => h("li", {}, x))),
  );
  showSheet();
}

function group(label, children) {
  return h("div", { class: "group" }, h("div", { class: "label" }, label), h("div", { class: "chips" }, children));
}
function chip(label, on, onclick, small, hot) {
  return h("button", { class: "chip" + (on ? " on" : "") + (hot ? " hot" : ""), onclick }, label, small ? h("small", {}, small) : null);
}

function addToCart(draft) {
  const key = (l) => [l.itemID, l.size, l.temp, l.sweetness, [...l.toppingIDs].sort().join("+")].join("|");
  const same = state.cart.find((l) => key(l) === key(draft));
  if (same) same.quantity = Math.min(20, same.quantity + draft.quantity);
  else state.cart.push({ ...draft, toppingIDs: [...draft.toppingIDs] });
  state.error = "";
  render();
}

// 购物车
function openCart() {
  const draw = () => {
    const sheet = document.getElementById("sheet");
    if (state.cart.length === 0) { closeSheet(); render(); return; }
    fill(sheet,
      h("div", { class: "head" },
        h("div", {}, h("h3", {}, t("cart")), h("div", { class: "alt" }, state.dining === "eatIn" ? t("eatIn") : t("takeOut"), SEAT ? " · " + t("seat") + " " + SEAT : "")),
        h("button", { class: "close", "aria-label": "close", onclick: closeSheet }, "✕"),
      ),
      state.cart.map((line, index) => {
        const item = itemById(line.itemID);
        return h("div", { class: "line" },
          h("div", { class: "names" },
            h("div", { class: "name" }, item ? nameOf(item) : line.itemID),
            h("div", { class: "opts" }, optionText(line)),
          ),
          h("div", { class: "qty" },
            h("button", { onclick: () => { line.quantity -= 1; if (line.quantity <= 0) state.cart.splice(index, 1); draw(); renderCartBar(); } }, "−"),
            h("span", {}, String(line.quantity)),
            h("button", { onclick: () => { line.quantity = Math.min(20, line.quantity + 1); draw(); renderCartBar(); } }, "+"),
          ),
          h("div", { class: "amt" }, yen(unitPrice(line) * line.quantity)),
        );
      }),
      h("div", { class: "total" }, h("span", {}, t("total")), h("b", {}, yen(cartTotal()))),
      h("textarea", {
        placeholder: t("notePh"), maxlength: "200", "aria-label": t("note"),
        oninput: (e) => { state.note = e.target.value; },
      }, state.note),
      state.error ? h("div", { class: "error" }, state.error) : null,
      h("button", { class: "primary", disabled: state.submitting || !state.accepting, onclick: submitOrder },
        state.submitting ? "…" : t("order") + "  " + yen(cartTotal())),
      h("div", { class: "paynote" }, t("payNote")),
    );
  };
  state.redrawCart = draw;
  draw();
  showSheet();
}

async function submitOrder() {
  if (state.submitting) return;
  state.submitting = true;
  state.error = "";
  state.redrawCart && state.redrawCart();
  try {
    const result = await rpc("chali_place_order", {
      p_store: STORE,
      p_dining: state.dining,
      p_seat: SEAT || null,
      p_note: state.note || null,
      p_items: state.cart.map((l) => ({
        itemID: l.itemID, size: l.size, temp: l.temp, sweetness: l.sweetness, toppingIDs: l.toppingIDs, quantity: l.quantity,
      })),
    });
    localStorage.setItem(ORDER_KEY, result.id);
    state.cart = [];
    state.note = "";
    closeSheet();
    await loadOrder(result.id);
  } catch (e) {
    state.error = errorText(e.message);
    if (e.message.startsWith("sold_out")) await loadMenu();
  } finally {
    state.submitting = false;
    if (!state.order && state.redrawCart) state.redrawCart();
  }
}

// 下单后的状态页
function renderStatus() {
  const o = state.order;
  const steps = ["received", "accepted", "ready"];
  const reached = o.status === "completed" ? 3 : steps.indexOf(o.status) + 1;
  const showPickup = o.pickupNumber && (o.status === "accepted" || o.status === "ready" || o.status === "completed");
  const pickup = showPickup ? String(o.pickupNumber).padStart(3, "0") : null;
  return h("div", { class: "status" },
    h("div", { class: "card" },
      h("div", { class: "lbl" }, pickup ? t("pickupNo") : t("yourNo")),
      h("div", { class: "num" + (o.status === "ready" ? " ready" : "") }, pickup || "Q" + o.number),
      pickup ? h("div", { class: "lbl" }, t("yourNo") + " Q" + o.number) : null,
      h("div", { class: "msg" }, t(o.status) || ""),
      o.status === "cancelled" && o.cancelReason ? h("div", { class: "lbl" }, t("reason") + "：" + o.cancelReason) : null,
      o.status !== "cancelled" ? h("div", { class: "steps" },
        [t("stepReceived"), t("stepAccepted"), t("stepReady")].map((label, i) =>
          h("div", { class: "step" + (i < reached ? " done" : "") }, h("i", {}), label)),
      ) : null,
    ),
    h("div", { class: "card lines" },
      o.lines.map((l) => h("div", { class: "line" },
        h("div", { class: "names" },
          h("div", { class: "name" }, nameOf(l) + (l.quantity > 1 ? " ×" + l.quantity : "")),
          h("div", { class: "opts" }, [l.size, (TEMP[lang] || TEMP.ja)[l.temp], l.sweetness + "%"]
            .concat(l.toppings.map((tp) => "+" + nameOf(tp))).join("・")),
        ),
        h("div", { class: "amt" }, yen(l.unitPrice * l.quantity)),
      )),
      h("div", { class: "total" }, h("span", {}, t("total")), h("b", {}, yen(o.total))),
    ),
    h("button", { class: "secondary", onclick: newOrder }, t("newOrder")),
  );
}

// ---------------------------------------------------------------------------
// 动作
// ---------------------------------------------------------------------------
function setLang(value) { lang = value; localStorage.setItem("chali-lang", value); render(); }
function setDining(value) { state.dining = value; render(); }
function jumpTo(id) {
  state.activeCat = id;
  render();
  const el = document.getElementById("cat-" + id);
  if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: "smooth" });
}
function showSheet() {
  document.getElementById("sheetBg").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet() {
  document.getElementById("sheetBg").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
  state.redrawCart = null;
}
function newOrder() {
  localStorage.removeItem(ORDER_KEY);
  state.order = null;
  stopPolling();
  loadMenu();
}

async function loadMenu() {
  try {
    const data = await rpc("chali_get_menu", { p_store: STORE });
    if (!data) throw new Error("store_not_found");
    state.storeName = data.storeName || state.storeName;
    state.accepting = !!data.accepting;
    state.menu = data.menu || { categories: [], items: [], toppings: [] };
    state.today = data.businessDay;
    if (!state.activeCat && state.menu.categories.length) state.activeCat = state.menu.categories[0].id;
    // 购物车里已经售罄或下架的去掉
    state.cart = state.cart.filter((l) => { const i = itemById(l.itemID); return i && !isSoldOut(i); });
    state.error = "";
  } catch (e) {
    state.error = errorText(e.message);
  }
  state.loading = false;
  document.title = state.storeName + " " + ({ ja: "モバイルオーダー", zh: "扫码点单", en: "Mobile Order" })[lang];
  render();
}

let pollTimer = null;
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

async function loadOrder(id) {
  try {
    const data = await rpc("chali_order_status", { p_order: id });
    if (!data) { newOrder(); return; }
    const wasReady = state.order && state.order.status === "ready";
    state.order = data;
    state.storeName = data.storeName || state.storeName;
    const canVibrate = navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive);
    if (data.status === "ready" && !wasReady && canVibrate) navigator.vibrate([200, 100, 200]);
    if (["completed", "cancelled"].includes(data.status)) stopPolling();
    else if (!pollTimer) pollTimer = setInterval(() => loadOrder(id), 3000);
  } catch (e) {
    // 网络不好时保留当前画面，下次轮询再试
  }
  state.loading = false;
  render();
}

document.getElementById("sheetBg").addEventListener("click", closeSheet);

(async function start() {
  const saved = localStorage.getItem(ORDER_KEY);
  if (saved) {
    await loadOrder(saved);
    if (state.order && ["completed", "cancelled"].includes(state.order.status)) {
      // 已经结束的单只显示一次，下次打开回到菜单
      localStorage.removeItem(ORDER_KEY);
    }
    if (state.order) return;
  }
  await loadMenu();
})();
</script>
