<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>茶里茶里 モバイルオーダー 二维码</title>
<style>
  @page { size: A5 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9ECE9; color: #1F2A24; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "Noto Sans JP", "Noto Sans SC", sans-serif; }
  .tools { max-width: 148mm; margin: 16px auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .tools input { width: 90px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, 0.15); font: inherit; }
  .tools button { padding: 9px 16px; border-radius: 10px; border: 0; background: #2E7D4F; color: #fff; font-weight: 800; font: inherit; font-weight: 800; cursor: pointer; }
  .tools span { color: #6B746F; font-size: 13px; }
  .tools select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, 0.15); font: inherit; }
  .queue { margin-top: 2mm; background: #FFF1C2; color: #7A5B00; border-radius: 3mm; padding: 2mm 5mm; font-size: 4.6mm; font-weight: 900; line-height: 1.35; }
  .queue small { display: block; font-size: 3.2mm; font-weight: 700; }
  .sheet {
    width: 148mm; height: 210mm; margin: 0 auto 24px; background: #fff; padding: 12mm 12mm 10mm;
    display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
  }
  .brand { font-size: 13mm; font-weight: 900; color: #2E7D4F; letter-spacing: 1mm; }
  .title { margin-top: 2mm; font-size: 8.5mm; font-weight: 900; }
  .title small { display: block; font-size: 4.6mm; font-weight: 700; color: #6B746F; margin-top: 1mm; }
  .qr { margin-top: 6mm; width: 78mm; height: 78mm; padding: 3mm; border: 1.2mm solid #2E7D4F; border-radius: 6mm; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .seat { margin-top: 3mm; font-size: 6mm; font-weight: 900; color: #2E7D4F; }
  .steps { margin-top: 5mm; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
  .step { background: #F2F4F1; border-radius: 4mm; padding: 3mm 2mm; }
  .step b { display: block; font-size: 6mm; color: #2E7D4F; }
  .step div { font-size: 3.6mm; font-weight: 800; line-height: 1.35; }
  .step small { display: block; font-size: 2.9mm; color: #6B746F; font-weight: 600; margin-top: 1mm; line-height: 1.3; }
  .url { margin-top: auto; font-size: 2.8mm; color: #9AA19D; word-break: break-all; }
  @media print {
    html, body { background: #fff; }
    .tools { display: none; }
    .sheet { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="tools">
  <select id="kind"><option value="counter">柜台用</option><option value="queue">排队用</option></select>
  桌号 <input id="seat" placeholder="不填也行" maxlength="10">
  <button onclick="window.print()">打印（A5）</button>
  <span>柜台、排队的地方用不带桌号的；每张桌子可以印一张带桌号的。</span>
</div>
<div class="sheet">
  <div class="brand">茶里茶里</div>
  <div class="title">モバイルオーダー<small>扫码点单 · Mobile Order</small></div>
  <div class="queue" id="queue" hidden>並んでいる間にスマホで注文できます<small>排队时可以先扫码点单 · Order on your phone while you wait</small></div>
  <div class="qr" id="qr"></div>
  <div class="seat" id="seatLabel"></div>
  <div class="steps">
    <div class="step"><b>1</b><div>QRを読んで注文</div><small>扫码选饮品<br>Scan &amp; order</small></div>
    <div class="step"><b>2</b><div>レジで番号を伝えてお支払い</div><small>到柜台报单号付款<br>Pay at the counter</small></div>
    <div class="step"><b>3</b><div>できあがりをスマホでお知らせ</div><small>手机提示后取餐<br>Pick up when ready</small></div>
  </div>
  <div class="url" id="url"></div>
</div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
"use strict";
const CONFIG = window.CHALI_CONFIG || {};
const params = new URLSearchParams(location.search);
// 顾客页面地址：config.js 里写了 orderUrl 就用它，否则用和这个页面同一个目录
const BASE = CONFIG.orderUrl || new URL("./", location.href).href;
const seatInput = document.getElementById("seat");
seatInput.value = params.get("t") || "";
const kindInput = document.getElementById("kind");
kindInput.value = params.get("k") === "queue" ? "queue" : "counter";

function draw() {
  const seat = seatInput.value.trim();
  const url = new URL(BASE);
  if (seat) url.searchParams.set("t", seat);
  const qr = qrcode(0, "M");
  qr.addData(url.href);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  document.getElementById("seatLabel").textContent = seat ? "席 / 桌 " + seat : "";
  document.getElementById("queue").hidden = kindInput.value !== "queue";
  document.getElementById("url").textContent = url.href;
}
seatInput.addEventListener("input", draw);
kindInput.addEventListener("change", draw);
draw();
</script>
</body>
</html>
