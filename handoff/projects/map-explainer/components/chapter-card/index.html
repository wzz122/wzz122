<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>chapter-card · 章节卡</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="../_shared/tokens.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="../_shared/map-runtime.js"></script>
<style>
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(244,239,230,.97) 0%, rgba(244,239,230,.9) 45%, rgba(244,239,230,.35) 100%); }
  .card { position: absolute; left: calc(var(--safe-x) + 40px); top: 50%; transform: translateY(-50%); max-width: 1200px; }
  .card__num { font: 600 260px/0.85 var(--font-num); color: var(--accent); letter-spacing: -0.02em; }
  .card__kicker { font: 700 36px/1 var(--font-body); color: var(--ink-soft); letter-spacing: .3em; margin: 24px 0 18px; }
  .card__title { font: 900 104px/1.15 var(--font-title); color: var(--ink); }
  .card__rule { height: 8px; width: 280px; background: var(--accent); margin: 30px 0 22px; transform-origin: 0 50%; }
  .card__sub { font: 500 40px/1.3 var(--font-body); color: var(--ink-soft); }
  .progress { position: absolute; right: var(--safe-x); bottom: calc(var(--safe-y) + 20px); display: flex; gap: 14px; }
  .progress i { width: 56px; height: 8px; border-radius: 4px; background: rgba(30,42,50,.18); }
  .progress i.on { background: var(--accent); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="map" id="map"></div>
  <div class="veil"></div>
  <div class="card" id="card">
    <div class="card__num" id="num"></div>
    <div class="card__kicker" id="kicker"></div>
    <div class="card__title" id="title"></div>
    <div class="card__rule" id="rule"></div>
    <div class="card__sub" id="sub"></div>
  </div>
  <div class="progress" id="progress"></div>
</div>
<script>
const CONFIG = MapRuntime.loadConfig({
  duration: 4.2,
  index: 2,
  total: 4,
  kicker: '第二章',
  title: '铁路为什么绕开了老城？',
  subtitle: '1886 · 东海道线选址（待核实）',
  style: 'positron',
  hideLabels: true, // 背景地图不要文字
  tint: true,
  showAttribution: true,
  // 背景地图缓慢漂移
  keyframes: [
    { t: 0,   center: [136.8815, 35.1709], zoom: 12.6, bearing: -8, pitch: 20 },
    { t: 4.2, center: [136.8960, 35.1760], zoom: 13.0, bearing: 0,  pitch: 30, ease: 'none' },
  ],
  out: 3.7, // 出场开始时间；设为 null 则不出场（交给转场）
});

const stage = document.getElementById('stage');
const map = MapRuntime.createMap('map', { style: CONFIG.style, camera: CONFIG.keyframes[0] });
const tl = gsap.timeline({ paused: true });

document.getElementById('num').textContent = String(CONFIG.index).padStart(2, '0');
document.getElementById('kicker').textContent = CONFIG.kicker;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('sub').textContent = CONFIG.subtitle;
const prog = document.getElementById('progress');
for (let i = 1; i <= CONFIG.total; i++) {
  const el = document.createElement('i');
  if (i <= CONFIG.index) el.className = 'on';
  prog.appendChild(el);
}

const chars = MapRuntime.splitChars(document.getElementById('title'));
gsap.set('#num', { opacity: 0, x: -60 });
gsap.set('#kicker', { opacity: 0 });
gsap.set(chars, { opacity: 0, y: 40 });
gsap.set('#rule', { scaleX: 0 });
gsap.set('#sub', { opacity: 0, y: 16 });
gsap.set('#progress i', { opacity: 0 });

tl.to('#num', { opacity: 1, x: 0, duration: 0.7, ease: 'power3.out' }, 0.1)
  .to('#kicker', { opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.3)
  .to(chars, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.03 }, 0.4)
  .to('#rule', { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, 0.8)
  .to('#sub', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.0)
  .to('#progress i', { opacity: 1, duration: 0.3, stagger: 0.06 }, 1.0);
if (CONFIG.out != null) {
  tl.to('#card', { opacity: 0, x: -30, duration: 0.45, ease: 'power2.in' }, CONFIG.out)
    .to('#progress', { opacity: 0, duration: 0.3, ease: 'power2.in' }, CONFIG.out);
}

const ready = MapRuntime.mapReady(map).then(() => {
  if (CONFIG.hideLabels) MapRuntime.hideSymbols(map);
  if (CONFIG.tint) MapRuntime.tintBasemap(map);
});

function apply(t) { map.jumpTo(MapRuntime.cameraAt(CONFIG.keyframes, t)); }

if (CONFIG.showAttribution) MapRuntime.addAttribution(stage, [MapRuntime.ATTRIBUTION.ofm]);

MapRuntime.installSeek({ timeline: tl, maps: [map], apply, ready, duration: CONFIG.duration });
</script>
</body>
</html>
