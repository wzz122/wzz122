# 发音词典：只改送去配音的文本，不改字幕。
# 写法：字幕里的词: 想让它怎么读（日语词写假名）
# 中文台词里夹日语词时最有用：例如「去拿源泉徴収票」会读成「去拿げんせんちょうしゅうひょう」。
# 长词优先替换，所以「源泉徴収票」和「源泉徴収」可以同时存在。
# 注意：一句中文里夹假名，个别音色可能把整句读成日语腔。听到这种情况，就把那一句的 lang 单独设成 ja，
# 或者在 ttsText 里改写。

源泉徴収票: げんせんちょうしゅうひょう
源泉徴収: げんせんちょうしゅう
確定申告: かくていしんこく
年末調整: ねんまつちょうせい
ふるさと納税: ふるさとのうぜい
住民税決定通知書: じゅうみんぜいけっていつうちしょ
ワンストップ特例: ワンストップとくれい

