name: ChaliPOS

on:
  push:
    paths:
      - "ChaliPOS/**"
      - ".github/workflows/chalipos.yml"
  pull_request:
    paths:
      - "ChaliPOS/**"
  workflow_dispatch:

jobs:
  core-tests:
    name: 数据层单元测试（Linux）
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ChaliPOS/CoreTests
        run: swift test

  ios-typecheck:
    name: iPad App 类型检查（iOS SDK）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: 用 iOS 模拟器 SDK 检查全部源码
        working-directory: ChaliPOS/ChaliPOS.swiftpm
        run: |
          find . -name '*.swift' -not -name 'Package.swift' | sort > sources.txt
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library -swift-version 5 \
            -target arm64-apple-ios16.0-simulator \
            $(cat sources.txt)
      - name: 构建 App 包
        working-directory: ChaliPOS/ChaliPOS.swiftpm
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild -scheme ChaliPOS -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -60
